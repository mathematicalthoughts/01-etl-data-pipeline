name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: etl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DEBUG: "False"
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/etl_test
      # El servicio de Postgres de Actions no expone SSL; Neon en dev/prod sí lo exige.
      DATABASE_SSL_REQUIRE: "False"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        # Necesario porque STORAGES["staticfiles"] usa el ManifestStaticFilesStorage
        # de whitenoise: sin el manifest (generado acá), cualquier template que use
        # {% static %} (todo el frontend server-rendered) rompe con ValueError.
        run: python manage.py collectstatic --noinput

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing

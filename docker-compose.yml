services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: etl_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d etl_test"]
      interval: 5s
      timeout: 5s
      retries: 10
